# Did the delta crawl run, and run clean? It runs elsewhere and records each run
# in the private repo; a delta that stopped looks exactly like a quiet day, so
# this goes red when the record is missing, stale or carries errors.
# Public repo: the log shows counts only; the report is mailed on failure.
name: freshness

on:
  schedule:
    - cron: '35 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: prep
        uses: ./.github/actions/prep
        with:
          need: RESEND_API_KEY ALERT_EMAIL EMAIL_FROM
          deploy-key: ${{ secrets.CODE_DEPLOY_KEY }}
          code-repo: ${{ secrets.CODE_REPO }}
      - id: probe
        name: Read the last delta run
        working-directory: code
        run: |
          rc=0
          python -m ci.checks.freshness --report "$RUNNER_TEMP/report.md" || rc=$?
          cat "$RUNNER_TEMP/report.md" >> "$RUNNER_TEMP/out.log"
          exit $rc
      - name: Mail on failure
        if: failure()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 scripts/mail_failure.py
