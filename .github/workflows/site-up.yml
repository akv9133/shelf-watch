# Is the front door open? The page kinds a reader opens, robots.txt, the
# sitemap it names, and covers through the image route, each 200 inside 10 s.
# Public repo: the log shows counts only; the report is mailed on failure.
name: site-up

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: prep
        uses: ./.github/actions/prep
        with:
          need: SITE_URL RESEND_API_KEY ALERT_EMAIL EMAIL_FROM
          deploy-key: ${{ secrets.CODE_DEPLOY_KEY }}
          code-repo: ${{ secrets.CODE_REPO }}
      - id: probe
        name: Fetch the pages a reader opens
        working-directory: code
        run: |
          rc=0
          python -m ci.checks.site_up --report "$RUNNER_TEMP/report.md" || rc=$?
          cat "$RUNNER_TEMP/report.md" >> "$RUNNER_TEMP/out.log"
          exit $rc
      - name: Mail on failure
        if: failure()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 scripts/mail_failure.py
