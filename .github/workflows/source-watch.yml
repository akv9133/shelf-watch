# Is each source still publishing, and is the delta keeping up? Asks each one
# for the newest id it lists and compares it with the delta's last record.
# Green when a source grew; red when one stays ahead of us past the window, or
# when the runner could measure none of them. Detects only, crawls nothing.
# Public repo: the log shows counts only; the report is mailed on failure.
name: source-watch

on:
  schedule:
    - cron: '25 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: prep
        uses: ./.github/actions/prep
        with:
          need: RESEND_API_KEY ALERT_EMAIL EMAIL_FROM
          deploy-key: ${{ secrets.CODE_DEPLOY_KEY }}
          code-repo: ${{ secrets.CODE_REPO }}
          pip: curl_cffi beautifulsoup4 lxml
      - id: probe
        name: Ask each source what it lists
        working-directory: code
        run: |
          rc=0
          python -m ci.checks.source_watch --report "$RUNNER_TEMP/report.md" || rc=$?
          cat "$RUNNER_TEMP/report.md" >> "$RUNNER_TEMP/out.log"
          exit $rc
      - name: Mail on failure
        if: failure()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 scripts/mail_failure.py
